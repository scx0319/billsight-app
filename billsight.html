<!DOCTYPE html>
<html lang="zh-CN">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>BillSight - 信用卡账单透视</title>
 <style>
 :root {
 --bg: #0a0a0f;
 --card-bg: #12121a;
 --border: #1e1e2e;
 --text: #e4e4ec;
 --text-secondary: #8888a0;
 --accent: #5b7fff;
 --green: #34d399;
 --yellow: #fbbf24;
 --red: #f87171;
 --danger: #ef4444;
 }

 * { margin: 0; padding: 0; box-sizing: border-box; }

 body {
 font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
 background: var(--bg);
 color: var(--text);
 min-height: 100vh;
 display: flex;
 justify-content: center;
 padding: 40px 20px;
 line-height: 1.6;
 }

 .container {
 max-width: 680px;
 width: 100%;
 }

 /* Header */
 .header {
 margin-bottom: 48px;
 text-align: center;
 }
 .banner {
 width: 100%;
 border-radius: 16px;
 margin-bottom: 24px;
 box-shadow: 0 8px 32px rgba(0,0,0,0.4);
 }
 .logo {
 font-size: 14px;
 font-weight: 500;
 color: var(--accent);
 letter-spacing: 2px;
 text-transform: uppercase;
 margin-bottom: 8px;
 }
 .title {
 font-size: 28px;
 font-weight: 600;
 letter-spacing: -0.5px;
 color: #fff;
 }
 .subtitle {
 font-size: 15px;
 color: var(--text-secondary);
 margin-top: 6px;
 }

 /* Card */
 .card {
 background: var(--card-bg);
 border: 1px solid var(--border);
 border-radius: 16px;
 padding: 28px 32px;
 margin-bottom: 20px;
 }
 .card-title {
 font-size: 13px;
 font-weight: 600;
 color: var(--text-secondary);
 text-transform: uppercase;
 letter-spacing: 1px;
 margin-bottom: 20px;
 }

 /* Form */
 .form-grid {
 display: grid;
 grid-template-columns: 1fr 1fr;
 gap: 16px;
 }
 .form-group {
 display: flex;
 flex-direction: column;
 }
 .form-group.full {
 grid-column: 1 / -1;
 }
 label {
 font-size: 12px;
 color: var(--text-secondary);
 margin-bottom: 6px;
 font-weight: 500;
 }
 input {
 background: var(--bg);
 border: 1px solid var(--border);
 border-radius: 10px;
 padding: 12px 14px;
 color: #fff;
 font-size: 15px;
 font-family: inherit;
 outline: none;
 transition: border-color 0.2s;
 }
 input:focus {
 border-color: var(--accent);
 }
 input::placeholder {
 color: #444;
 }

 .btn {
 background: #fff;
 color: #000;
 border: none;
 border-radius: 10px;
 padding: 12px 24px;
 font-size: 14px;
 font-weight: 600;
 cursor: pointer;
 font-family: inherit;
 transition: opacity 0.2s;
 }
 .btn:hover { opacity: 0.85; }
 .btn-block { width: 100%; margin-top: 8px; }

 /* Alert Banner */
 .alert {
 border-radius: 10px;
 padding: 16px 20px;
 margin-bottom: 16px;
 font-size: 14px;
 font-weight: 500;
 }
 .alert-green {
 background: rgba(52,211,153,0.1);
 border: 1px solid rgba(52,211,153,0.3);
 color: var(--green);
 }
 .alert-yellow {
 background: rgba(251,191,36,0.1);
 border: 1px solid rgba(251,191,36,0.3);
 color: var(--yellow);
 }
 .alert-red {
 background: rgba(248,113,113,0.1);
 border: 1px solid rgba(248,113,113,0.3);
 color: var(--red);
 animation: pulse 1.5s infinite;
 }
 @keyframes pulse {
 0%,100% { opacity: 1; }
 50% { opacity: 0.7; }
 }

 /* Suspicious fees */
 .fee-item {
 display: flex;
 justify-content: space-between;
 align-items: flex-start;
 padding: 14px 0;
 border-bottom: 1px solid var(--border);
 }
 .fee-item:last-child { border-bottom: none; }
 .fee-name {
 font-weight: 500;
 font-size: 14px;
 }
 .fee-amount {
 font-weight: 700;
 font-size: 18px;
 color: var(--danger);
 }
 .fee-explanation {
 font-size: 12px;
 color: var(--text-secondary);
 margin-top: 4px;
 line-height: 1.5;
 }
 .empty-state {
 text-align: center;
 color: var(--text-secondary);
 padding: 40px 0;
 font-size: 14px;
 }

 /* Privacy badge */
 .privacy {
 display: flex;
 align-items: center;
 gap: 8px;
 font-size: 11px;
 color: var(--text-secondary);
 margin-top: 24px;
 justify-content: center;
 }
 .privacy-dot {
 width: 6px;
 height: 6px;
 background: var(--green);
 border-radius: 50%;
 }
 </style>
</head>
<body>
 <div class="container">
 <!-- Header -->
 <div class="header">
 <img src="billsight-banner.jpg" alt="BillSight" class="banner">
 <div class="logo">BillSight</div>
 <div class="title">信用卡账单透视</div>
 <div class="subtitle">一眼看懂账单里每一分钱</div>
 </div>

 <!-- Input Card -->
 <div class="card">
 <div class="card-title">📋 录入本期账单</div>
 <div class="form-grid">
 <div class="form-group">
 <label>账单金额 (元)</label>
 <input type="number" id="billAmount" placeholder="例如 5680.50" step="0.01">
 </div>
 <div class="form-group">
 <label>还款日</label>
 <input type="date" id="dueDate">
 </div>
 <div class="form-group">
 <label>最低还款额 (元)</label>
 <input type="number" id="minPayment" placeholder="例如 568.05" step="0.01">
 </div>
 <div class="form-group">
 <label>本期应还总额 (元)</label>
 <input type="number" id="totalDue" placeholder="例如 5800.50" step="0.01">
 </div>
 <div class="form-group full">
 <button class="btn btn-block" onclick="analyzeBill()">🔍 分析账单</button>
 </div>
 </div>
 </div>

 <!-- Alert Banner -->
 <div id="alertBanner"></div>

 <!-- Suspicious Fees Card -->
 <div class="card" id="feesCard">
 <div class="card-title">⚠️ 可疑费用标记</div>
 <div id="feesList">
 <div class="empty-state">请先录入账单，然后点击"分析账单"</div>
 </div>
 </div>

 <!-- Coffee support -->
 <div class="card" id="supportCard">
 <div class="card-title">☕ 觉得有用？请我喝杯咖啡</div>
 <div style="text-align:center; padding: 20px 0; color: var(--text-secondary);">
 <img src="billsight_qrcode.jpg" style="width:200px;height:200px;border-radius:12px;margin-bottom:12px;" alt="赞赏码">
 <div style="font-size:14px; margin-bottom:8px;">扫码打赏，金额随意</div>
 <div style="font-size:12px; color: #555;">你的支持是我持续优化工具的动力</div>
 </div>
 </div>

 <!-- Privacy badge -->
 <div class="privacy">
 <div class="privacy-dot"></div>
 所有数据仅存储在您的设备本地，不上传任何服务器
 </div>
 </div>

 <script>
 // Load saved data from localStorage
 window.onload = function() {
 const saved = localStorage.getItem('billsight_data');
 if (saved) {
 const data = JSON.parse(saved);
 document.getElementById('billAmount').value = data.billAmount || '';
 document.getElementById('dueDate').value = data.dueDate || '';
 document.getElementById('minPayment').value = data.minPayment || '';
 document.getElementById('totalDue').value = data.totalDue || '';
 if (data.billAmount && data.dueDate) {
 analyzeBill();
 }
 }
 };

 function saveData() {
 const data = {
 billAmount: document.getElementById('billAmount').value,
 dueDate: document.getElementById('dueDate').value,
 minPayment: document.getElementById('minPayment').value,
 totalDue: document.getElementById('totalDue').value
 };
 localStorage.setItem('billsight_data', JSON.stringify(data));
 }

 function addCalendarReminder(dueDateStr, totalDue) {
            // 把还款日减去1天，提醒用户提前还款
            const dueDate = new Date(dueDateStr + 'T00:00:00');
            const remindDate = new Date(dueDate);
            remindDate.setDate(remindDate.getDate() - 1); // 提前1天提醒

            // 格式化成 iCalendar 标准格式
            const formatICSDate = (date) => {
                return date.getFullYear() + 
                       String(date.getMonth() + 1).padStart(2, '0') + 
                       String(date.getDate()).padStart(2, '0') + 'T090000';
            };

            const icsContent = `BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//BillSight//信用卡还款提醒//CN
BEGIN:VEVENT
DTSTART:${formatICSDate(remindDate)}
DTEND:${formatICSDate(new Date(remindDate.getTime() + 30 * 60 * 1000))}
SUMMARY:💳 信用卡还款日提醒 - 应还 ¥${totalDue.toFixed(0)}
DESCRIPTION:明天就是还款日！本期应还总额 ¥${totalDue.toFixed(2)}\\n\\n请确保账户余额充足，避免逾期影响征信。\\n\\n——来自 BillSight 信用卡账单透视
BEGIN:VALARM
TRIGGER:-PT15M
ACTION:DISPLAY
DESCRIPTION:⏰ 快去还信用卡！明天就到期了
END:VALARM
END:VEVENT
END:VCALENDAR`;

            // 创建下载链接
            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '信用卡还款提醒.ics';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            alert('✅ 日历文件已生成！\n\n打开下载的 .ics 文件，手机会自动跳转到日历App，你只需要点一下"添加"就可以了。\n\n这是手机系统日历在提醒你，不是我在后台跑，你的数据依然是绝对安全的。');
        }

 function analyzeBill() {
 // Save data
 saveData();

 // Get values
 const billAmount = parseFloat(document.getElementById('billAmount').value) || 0;
 const dueDateStr = document.getElementById('dueDate').value;
 const minPayment = parseFloat(document.getElementById('minPayment').value) || 0;
 const totalDue = parseFloat(document.getElementById('totalDue').value) || 0;

 if (!billAmount || !dueDateStr) {
 alert('请至少填写账单金额和还款日');
 return;
 }

 // Calculate suspicious fees
 const feeItems = [];

 // Rule 1: If totalDue > billAmount, there's interest
 if (totalDue > billAmount && billAmount > 0) {
 const interest = totalDue - billAmount;
 feeItems.push({
 name: '循环利息',
 amount: interest,
 explanation: '因为上期没有全额还清，银行从消费当天开始计算每天万分之五的利息。这笔' + interest.toFixed(2) + '元就是利息累积的结果。如果每次都全额还款，就不会产生这笔费用。'
 });
 }

 // Rule 2: If minPayment exists and is suspiciously low
 if (minPayment > 0 && totalDue > 0) {
 const ratio = minPayment / totalDue;
 if (ratio < 0.1) {
 feeItems.push({
 name: '最低还款陷阱提示',
 amount: totalDue - minPayment,
 explanation: '最低还款额只有应还总额的' + (ratio*100).toFixed(0) + '%。如果只还最低额，剩余未还部分将从记账日起按每天万分之五计息，并计入下期账单，长期下来利息可能超过本金。建议尽量全额还款。'
 });
 }
 }

 // Rule 3: If billAmount > 0 and no minPayment ratio indicates penalties
 if (totalDue > billAmount * 1.05 && billAmount > 0) {
 feeItems.push({
 name: '⚠️ 可能含违约金',
 amount: totalDue - billAmount * 1.05,
 explanation: '超出账单金额5%以上的部分，可能是逾期产生的违约金。建议核对上期是否还款延迟，并及时联系银行客服确认。'
 });
 }

 // Render fees
 const feesList = document.getElementById('feesList');
 if (feeItems.length === 0) {
 feesList.innerHTML = '<div style="text-align:center; color: #34d399; padding:20px 0; font-size:14px;">✅ 暂未发现可疑收费，你的账单看起来很干净</div>';
 } else {
 feesList.innerHTML = feeItems.map(item => `
 <div class="fee-item">
 <div style="flex:1;">
 <div class="fee-name">${item.name}</div>
 <div class="fee-explanation">${item.explanation}</div>
 </div>
 <div class="fee-amount" style="margin-left:16px;">¥${item.amount.toFixed(2)}</div>
 </div>
 `).join('');
 }

 // Add calendar reminder button if due date is set
 const alertBanner = document.getElementById('alertBanner');
 let reminderBtn = '';
 if (dueDateStr && totalDue > 0) {
 reminderBtn = `<button class="btn btn-block" style="margin-top:12px;background:var(--accent);color:#fff;" onclick="addCalendarReminder('${dueDateStr}', ${totalDue})">📅 添加还款日到手机日历</button>`;
 }

 // Render alert banner - 更精确的日期比较
 const today = new Date();
 const todayStr = today.getFullYear() + '-' + 
 String(today.getMonth() + 1).padStart(2, '0') + '-' + 
 String(today.getDate()).padStart(2, '0');
 const dueDatePart = new Date(dueDateStr + 'T00:00:00');
 const todayDatePart = new Date(todayStr + 'T00:00:00');
 const diffDays = Math.ceil((dueDatePart - todayDatePart) / (1000 * 60 * 60 * 24));

 const alertBanner = document.getElementById('alertBanner');
 if (diffDays < 0) {
 alertBanner.innerHTML = `<div class="alert alert-red">🚨 已逾期 ${Math.abs(diffDays)} 天！请立即联系银行客服说明情况，并尽快还款以避免影响征信。</div>`;
 } else if (diffDays === 0) {
 alertBanner.innerHTML = `<div class="alert alert-red">🔴 今天就是最后还款日！立即还款避免逾期！应还总额 ¥${totalDue.toFixed(2)}</div>`;
 } else if (diffDays <= 3) {
 alertBanner.innerHTML = `<div class="alert alert-yellow">🟡 还有 ${diffDays} 天到还款日，本期应还 ¥${totalDue.toFixed(2)}，请提前准备资金</div>`;
 } else {
 alertBanner.innerHTML = `<div class="alert alert-green">🟢 距离还款日还有 ${diffDays} 天，账单状态正常，应还 ¥${totalDue.toFixed(2)}</div>${reminderBtn}`;
 }
 // Also add reminder button for yellow alerts
 if (diffDays > 0 && diffDays <= 3) {
 alertBanner.innerHTML = `<div class="alert alert-yellow">🟡 还有 ${diffDays} 天到还款日，本期应还 ¥${totalDue.toFixed(2)}，请提前准备资金</div>${reminderBtn}`;
 }
 }
 </script>
</body>
</html>
